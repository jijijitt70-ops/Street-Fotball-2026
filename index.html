<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Street Football 26</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- MENÚ PRINCIPAL -->
  <div id="menu">

    <div class="logo">
      STREET
      <span>FOOTBALL</span>
    </div>

    <div class="edition">26</div>

    <button id="playBtn" class="mainButton">
      ⚽ JUGAR
    </button>

    <button id="tournamentBtn" class="menuButton">
      🏆 TORNEO
    </button>

    <button id="playerBtn" class="menuButton">
      👤 MI JUGADOR
    </button>

    <p class="copyright">
      STREET FOOTBALL 26
    </p>

  </div>


  <!-- JUEGO -->
  <div id="game" class="hidden">

    <!-- MARCADOR -->
    <div id="score">

      <div class="team">
        <small>LOCAL</small>
        <b id="homeScore">0</b>
      </div>

      <div id="timer">
        03:00
      </div>

      <div class="team">
        <small>VISITANTE</small>
        <b id="awayScore">0</b>
      </div>

    </div>


    <!-- CAMPO -->
    <canvas id="field"></canvas>


    <!-- JOYSTICK -->
    <div id="joystick">
      <div id="stick"></div>
    </div>


    <!-- BOTONES -->
    <div id="buttons">

      <button id="pass">
        PASE
      </button>

      <button id="shoot">
        TIRAR
      </button>

      <button id="sprint">
        ⚡
      </button>

    </div>


    <!-- VOLVER -->
    <button id="back">
      ✕
    </button>

  </div>


  <script src="script.js"></script>

</body>
</html>
